# Tag a version, get a downloadable editor.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Builds on a Windows runner (the exe is a Windows build), zips the packaged
# folder and attaches it to a GitHub release. Nothing here needs a secret beyond
# the token GitHub hands the workflow itself.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist)'
        required: true

permissions:
  contents: write        # creating a release and uploading to it

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      # The same checks build.yml runs, before anything is packaged: a release
      # is the one moment where shipping something broken actually costs
      # someone else's time. The stub is a data root the editor accepts as
      # configured — empty is fine, these tests only use maps they create.
      - name: Stub data root
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stub-data/MapObjects, stub-data/Maps | Out-Null
          "HOMM5_DATA=$PWD/stub-data" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - run: npm run test-e2e-nodata

      - run: npm run dist

      - name: Zip the packaged folder
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace '^refs/tags/', '' } else { '${{ inputs.tag }}' }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Compress-Archive -Path dist/homm5-editor-win32-x64/* -DestinationPath "homm5-editor-$tag-win-x64.zip"

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # What changed comes from CHANGELOG.md — one place to write it, and it
          # is already the file anyone reading the repo would look in. The
          # section is the one whose heading starts with this tag's version.
          $version = $env:TAG -replace '^v', ''
          # Explicit encoding: the prose has em dashes, and a reader that guesses
          # the codepage turns them into rubbish in the release notes.
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = ($lines | Select-String -Pattern "^## $([regex]::Escape($version))\b" | Select-Object -First 1).LineNumber
          if (-not $start) { throw "CHANGELOG.md has no section for $version — add one before tagging." }
          $rest = $lines[$start..($lines.Count - 1)]
          $next = ($rest | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
          $body = if ($next) { $rest[0..($next - 2)] } else { $rest }

          # The standing part: true of every build, and the SmartScreen
          # paragraph is what a first-time downloader most needs to read.
          $standing = @'

          ---

          A standalone build. No installer — unzip anywhere and run `homm5-editor.exe`.

          **First run asks two questions**: where Heroes V is installed, and where to put the unpacked
          game data (about 3 GB). It unpacks the archives itself; the answers are remembered, and
          `homm5-editor.exe --setup` reopens that screen later.

          **The build is not code-signed.** Windows SmartScreen will warn about an unknown publisher:
          More info → Run anyway. A signature needs a certificate from a certificate authority, which
          this project does not have.

          Needs the game itself — it reads its models, textures and rosters. It ships none of them.
          '@

          ($body -join "`n") + "`n" + $standing | Out-File -FilePath notes.md -Encoding utf8
          # A dash in the version is a pre-release (-alpha.1, -rc.1) and GitHub
          # should say so on the release itself, not only in the notes. Two
          # spelled-out calls, no splatting: pwsh hands a splatted array to a
          # native command badly enough that gh read a bare `-` as an asset.
          if ($version -match '-') {
            gh release create "$env:TAG" "homm5-editor-$env:TAG-win-x64.zip" --title "homm5-editor $env:TAG" --notes-file notes.md --prerelease
          } else {
            gh release create "$env:TAG" "homm5-editor-$env:TAG-win-x64.zip" --title "homm5-editor $env:TAG" --notes-file notes.md
          }
