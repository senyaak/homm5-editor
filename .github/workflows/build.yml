# Does it still compile, package, and work?
#
# Most of the suite reads the game's own data — 3 GB of unpacked archives that
# are copyrighted and quite rightly not in this repository — so those tests stay
# local. But a real slice of the app never touches it: creating a blank map,
# packing and reopening a .h5m, the texts, localisation, and building a campaign
# are all our own file formats end to end. Those carry @nodata and run here,
# against a data root that is two empty folders.

name: build

# Not on every push: the work here lands as a stream of small commits from a
# machine that has the game and has already run the whole suite, so a run per
# commit would only re-check what was checked better locally. The release
# workflow runs these same steps before it packages anything, which is the
# moment they actually decide something.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Node 24 or newer: the tools and the Electron entry point are TypeScript
      # run straight off disk, which needs native type stripping.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # The app bundle, not the exe: it is the step that would fail on a bad
      # import, and it takes seconds where packaging takes minutes.
      - run: npm run build:app

      # A data root the editor accepts as configured. MapObjects/ is the marker
      # it looks for — empty is fine, because these tests only ever create their
      # own maps. Without it the app opens its setup window instead, which is
      # correct behaviour and would fail every test for the wrong reason.
      - name: Stub data root
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stub-data/MapObjects, stub-data/Maps | Out-Null
          "HOMM5_DATA=$PWD/stub-data" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Electron drives a real window here; the Windows runner has a desktop
      # session, so nothing like Xvfb is needed.
      - run: npm run test-e2e-nodata

      - name: Keep the failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: test-results/
          retention-days: 7
