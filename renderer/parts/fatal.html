  <!-- The failure trap, armed before the bundle it watches.
       app.js is one ES module: anything thrown at its top level stops the rest
       of the file. Everything visible above is static markup, so the window
       still looks alive — a toolbar wired to nothing and a map list stuck on
       "loading…" forever. That is the shape this reached a user in: "I click
       and nothing happens." A message beats a dead window, and the trap has to
       be plain inline script, because the module that would have handled the
       error is the thing that died. -->
  <script>
    (function () {
      var shown = false;
      function fatal(what, detail) {
        if (shown) return; // the first error is the cause; the rest are echoes
        shown = true;
        var el = document.createElement('div');
        el.id = 'fatal';
        // Two different accidents wear this screen. Before boot finishes, the
        // window is a dead shell and "did not start" is the whole story. AFTER
        // it — a map closing, a scene loading — the editor has been working for
        // an hour, and telling its user it never started sends them looking at
        // their graphics driver instead of at what they just did.
        var late = !!window.__booted;
        el.innerHTML = '<h2>' + (late ? 'The editor hit an error' : 'The editor did not start') + '</h2><p></p>'
          + '<div class="row"><button id="fatal-soft" hidden></button></div>'
          + '<pre></pre>'
          + '<div class="row"><button id="fatal-copy">Copy the details</button>'
          + '<button id="fatal-dev">Open DevTools</button></div>';
        el.querySelector('p').textContent = what;
        el.querySelector('pre').textContent = detail || '';
        (document.body || document.documentElement).appendChild(el);
        el.querySelector('#fatal-copy').onclick = function () {
          navigator.clipboard.writeText(el.querySelector('p').textContent
            + '\n\n' + el.querySelector('pre').textContent);
        };
        // Both of these still work with the renderer dead: preload runs in its
        // own context, so window.editor is there even now.
        el.querySelector('#fatal-dev').onclick = function () {
          if (window.editor && window.editor.openDevTools) window.editor.openDevTools();
        };
        // What Chromium made of this machine's graphics, appended as it arrives.
        // Guessing is the alternative: "no WebGL" has a dozen causes (a driver
        // on the blocklist, a remote-desktop session, a VM, a laptop's idle
        // second GPU) and they are indistinguishable from the message alone.
        // This puts the answer in the copyable block, so a report from someone
        // else's machine says which one it was.
        //
        // ONLY for a 3D failure. Pasted under an error that has nothing to do
        // with graphics it is worse than nothing: it is the longest block on
        // the screen, it reads like the diagnosis, and it sent us reading a
        // healthy RTX 3080's feature list while the actual error — one line
        // above it, from closing a map — went unquoted.
        if (/WebGL|3D|context/i.test(what) && window.editor && window.editor.gpuReport) {
          window.editor.gpuReport().then(function (report) {
            var pre = el.querySelector('pre');
            pre.textContent = (pre.textContent ? pre.textContent + '\n\n' : '') + report;
          }, function () { /* diagnostics are a bonus; never hide the error */ });
        }
        // The one repair a user can actually make here, and the reason this is a
        // button rather than a line of advice: the editor is normally started by
        // double-clicking a packaged build, where there is no command line to put
        // --use-angle=swiftshader on. Offered only when the failure is about the
        // 3D context, and not when software rendering is already what failed.
        var soft = el.querySelector('#fatal-soft');
        if (/WebGL|3D/.test(what) && window.editor && window.editor.gpuSoftware) {
          window.editor.gpuSoftware().then(function (already) {
            if (already) {
              var p = el.querySelector('p');
              p.textContent = p.textContent
                + '\n\nSoftware rendering is already on, and it did not help — so this is not a '
                + 'driver Chromium mistrusts, but a machine giving it no 3D at all.';
              return;
            }
            soft.textContent = 'Restart with software rendering (slow, but works anywhere)';
            soft.hidden = false;
            soft.onclick = function () {
              soft.disabled = true;
              soft.textContent = 'restarting…';
              window.editor.setGpuSoftware(true);
            };
          }, function () { /* leave the button hidden */ });
        }
      }
      // A stack starts with the message it belongs to, and the message is
      // already the headline here — kept whole, it would be printed twice, with
      // the frames that matter pushed below the fold.
      function frames(err) {
        var stack = (err && err.stack) || '';
        return err && err.message && stack.indexOf(err.message) !== -1
          ? stack.slice(stack.indexOf(err.message) + err.message.length).replace(/^\s*\n/, '')
          : stack;
      }
      // Capture phase: a <script> that fails to load fires its error event on the
      // element and never reaches window.onerror, so listening on the way down is
      // what catches "the bundle is not there at all".
      window.addEventListener('error', function (e) {
        if (e.error) fatal(e.error.message || String(e.error), frames(e.error));
        else if (e.target && e.target.src) fatal('Could not load ' + e.target.src, '');
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        fatal(r && r.message ? r.message : String(r), frames(r));
      });
      // The silent variant: nothing throws, but boot never finishes — an await
      // that never settles. There is no event for that, so watch for the finish
      // line instead. Boot is milliseconds when it works, so this only ever
      // fires on a genuine hang.
      setTimeout(function () {
        if (!window.__booted) {
          fatal('The renderer loaded but never finished starting up.',
            'Nothing was thrown, so this is something the app is still waiting for.');
        }
      }, 15000);
    })();
  </script>
