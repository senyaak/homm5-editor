  <!-- Templates — the random map generator's template editor, a module of its
       own (renderer/features/rmg-templates.ts). The zones as rectangles the way
       an ER diagram draws an entity: index and race in the header, the
       properties as rows of a glyph and a number; a connection a line labelled
       with its guard, dashed when roadless. The file holds no coordinates the
       map reads: the picture is laid out from the graph, or kept in a
       <Diagram> block of ours. Saved as the install's own .h5et
       (<game>/H5E/RMG/Templates/), which the generator's dialog then lists. -->
  <dialog id="rte">
    <div class="mp-card rte-card">
      <div class="mp-head">
        <span class="mp-title">Templates</span>
        <select id="rte-list" title="the templates the generator's dialog lists — the install's own, the editor's, the game's"></select>
        <span id="rte-loading" class="rmg-wait" title="reading the install's templates" hidden><span class="spin"></span></span>
        <button id="rte-new" class="rte-btn" title="a new template of one start zone">New</button>
        <button id="rte-close" title="close (Esc)">✕</button>
      </div>
      <div class="rte-body">
        <div class="rte-stage">
          <div class="rte-tools">
            <button id="rte-add-zone" class="rte-btn" title="add a zone — a copy of the last one, with the next index">+ Zone</button>
            <button id="rte-connect" class="rte-btn" title="join two zones: press, then click one zone and then the other">Connect</button>
            <button id="rte-remove" class="rte-btn" title="remove the selected zone (and its connections) or connection" disabled>Remove</button>
            <button id="rte-arrange" class="rte-btn" title="lay the picture out from the graph again">Arrange</button>
            <span id="rte-hint" class="rte-hint"></span>
          </div>
          <svg id="rte-svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet"></svg>
          <div id="rte-warn" class="rte-warn"></div>
        </div>
        <div class="rte-panel" id="rte-panel"></div>
      </div>
      <div class="de-foot rte-foot">
        <span id="rte-where" class="nm-where"></span>
        <label class="rte-file"><span>File</span><input id="rte-file" type="text" spellcheck="false" autocomplete="off" title="the file name — what an order names; saved as <game>/H5E/RMG/Templates/&lt;file&gt;.h5et"></label>
        <span id="rte-err" class="on-err"></span>
        <button id="rte-delete" class="ghost" title="remove the install's own copy — the game's and the editor's stay">Delete</button>
        <button id="rte-save">Save</button>
      </div>
    </div>
  </dialog>
