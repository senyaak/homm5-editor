  <!-- Quality of life: how the GAME plays, not what a map contains.
       A panel of its own rather than a tab of the mod dialogs, because nothing
       in here builds an archive or touches an open map — it writes one config
       file beside the executable, which the extension reads at startup. Every
       flag is off in an install that never opened this. -->
  <dialog id="qolcfg">
    <div class="mp-card" style="max-width:560px">
      <div class="mp-head">
        <span class="mp-title">Game settings</span>
        <button id="qol-x" title="close (Esc)">✕</button>
      </div>
      <!-- Two tabs, one file: preferences and bug fixes are both lines in the
           same config, but the FIXES are not taste — that tab has an "all of
           them" switch and this one does not, which is the whole difference. -->
      <div class="mp-tabs">
        <button id="qol-tab-qol" class="mp-tab on">Quality of life</button>
        <button id="qol-tab-fixes" class="mp-tab">Fixes</button>
        <button id="qol-tab-gameplay" class="mp-tab">Gameplay</button>
      </div>
      <div class="mp-body on-body">
        <!-- Said before anything is ticked, not after Apply: without the
             extension in the install this whole panel writes a file that
             nothing will ever read. -->
        <div id="qol-warn" class="qol-warn" hidden></div>
        <div id="qol-list" class="qol-list"></div>
        <div id="qol-fixes" class="qol-list" hidden>
          <label class="qol-all"><input id="qol-all-fixes" type="checkbox"> Enable every fix</label>
          <div id="qol-fixes-groups"></div>
        </div>
        <!-- Gameplay: things the game never had, put IN — where a fix takes
             something wrong OUT. Each is an archive that follows its flag. -->
        <div id="qol-gameplay" class="qol-list" hidden></div>
        <div id="qol-file" class="qol-file"></div>
      </div>
      <div class="de-foot">
        <span id="qol-msg" class="qol-msg"></span>
        <button id="qol-close" class="ghost">Close</button>
        <button id="qol-apply">Apply</button>
      </div>
    </div>
  </dialog>
