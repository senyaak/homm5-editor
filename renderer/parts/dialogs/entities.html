  <!-- type-constrained object picker (the original's "Objects: <Class>" list) -->
  <dialog id="objpick">
    <div class="mp-card op-card">
      <div class="mp-head">
        <span class="mp-title" id="op-title">Select object</span>
        <button id="op-close" title="close (Esc)">✕</button>
      </div>
      <div class="op-search"><input id="op-search" type="text" placeholder="filter…" spellcheck="false" autocomplete="off"></div>
      <div class="mp-body op-body"><div id="op-list" class="op-list"></div></div>
      <div class="de-foot">
        <button id="op-cancel" class="ghost">Cancel</button>
        <button id="op-ok">Select</button>
      </div>
    </div>
  </dialog>

  <!-- create a new referenced object of a fixed class (the original's
       "Create New <Class> Object") -->
  <dialog id="objnew">
    <div class="mp-card on-card">
      <div class="mp-head">
        <span class="mp-title" id="on-title">Create New Object</span>
        <button id="on-close" title="close (Esc)">✕</button>
      </div>
      <div class="mp-body on-body">
        <label class="on-row" id="on-typerow"><span>Type</span><input id="on-type" type="text" readonly></label>
        <label class="on-row"><span id="on-namelabel">Name</span><input id="on-name" type="text" spellcheck="false" autocomplete="off"></label>
        <div id="on-err" class="on-err"></div>
      </div>
      <div class="de-foot">
        <button id="on-cancel" class="ghost">Cancel</button>
        <button id="on-ok">Create</button>
      </div>
    </div>
  </dialog>

  <!-- New town specialization: a map-local named bonus, packed with the map -->
  <dialog id="specnew">
    <div class="mp-card on-card">
      <div class="mp-head">
        <span class="mp-title">New town specialization</span>
        <button id="sn-close" title="close (Esc)">✕</button>
      </div>
      <div class="mp-body on-body">
        <label class="on-row"><span>Name</span><input id="sn-name" type="text" spellcheck="false" autocomplete="off" placeholder="shown in game (optional)"></label>
        <label class="on-row"><span>Bonus</span><select id="sn-bonus"></select></label>
        <label class="on-row"><span>Faction</span><select id="sn-faction"></select></label>
        <div id="sn-err" class="on-err"></div>
      </div>
      <div class="de-foot">
        <button id="sn-cancel" class="ghost">Cancel</button>
        <button id="sn-ok">Create &amp; link</button>
      </div>
    </div>
  </dialog>

  <!-- edit a referenced entity's own typed fields (the original's "Edit" on a
       structured ref: an AdvMapBirds flock, a Wind, an AmbientLight preset) -->
  <dialog id="entedit">
    <div class="mp-card ee-card">
      <div class="mp-head">
        <span class="mp-title" id="ee-title">Edit</span>
        <button id="ee-close" title="close (Esc)">✕</button>
      </div>
      <div id="ee-note" class="ee-note"></div>
      <div class="mp-body ee-body"><div id="ee-form"></div></div>
      <div class="de-foot">
        <button id="ee-copy" class="ghost" style="margin-right:auto;display:none">Save a copy in map</button>
        <button id="ee-done">Done</button>
      </div>
    </div>
  </dialog>
