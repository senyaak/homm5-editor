  <!-- Campaigns — the original editor's three steps, which is why there are
       three dialogs: pick/create a campaign, edit it, edit one mission. Unlike
       the original, an existing campaign can be reopened and edited. -->
  <dialog id="camplist">
    <div class="mp-card cl-card">
      <div class="mp-head">
        <span class="mp-title">Campaigns</span>
        <button id="cl-close" title="close (Esc)">✕</button>
      </div>
      <div class="mp-body cl-body"><div id="cl-list" class="cl-list"></div></div>
      <div class="de-foot">
        <input id="cl-name" type="text" spellcheck="false" autocomplete="off" placeholder="new campaign name…">
        <button id="cl-new">Create</button>
      </div>
    </div>
  </dialog>

  <dialog id="campaign">
    <div class="mp-card cp-card">
      <div class="mp-head">
        <span class="mp-title" id="cp-title">Campaign</span>
        <button id="cp-close" title="close (Esc)">✕</button>
      </div>
      <div class="mp-body cp-body">
        <label class="on-row"><span>Name</span><input id="cp-name" type="text" spellcheck="false" autocomplete="off"></label>
        <label class="on-row"><span>Short description</span><input id="cp-summary" type="text" spellcheck="false" autocomplete="off"></label>
        <label class="on-row cp-desc"><span>Description</span><textarea id="cp-description" rows="4" spellcheck="false"></textarea></label>
        <fieldset class="cp-missions">
          <legend>Missions</legend>
          <div class="cp-grid">
            <table class="cp-table"><thead><tr><th>##</th><th>Map name</th></tr></thead><tbody id="cp-rows"></tbody></table>
            <div class="cp-side">
              <button id="cp-add">Add</button>
              <button id="cp-edit" disabled>Edit</button>
              <button id="cp-remove" disabled>Remove</button>
              <button id="cp-up" disabled>Up</button>
              <button id="cp-down" disabled>Down</button>
            </div>
          </div>
        </fieldset>
        <div id="cp-err" class="on-err"></div>
      </div>
      <div class="de-foot">
        <button id="cp-pack" class="ghost" style="margin-right:auto">Pack .h5c…</button>
        <button id="cp-cancel" class="ghost">Cancel</button>
        <button id="cp-ok">Save</button>
      </div>
    </div>
  </dialog>

  <dialog id="mission">
    <div class="mp-card ms-card">
      <div class="mp-head">
        <span class="mp-title">Mission</span>
        <button id="ms-close" title="close (Esc)">✕</button>
      </div>
      <div class="mp-body ms-body">
        <label class="on-row"><span>Map</span><select id="ms-map"></select></label>
        <label class="on-row"><span>Mission name</span><input id="ms-name" type="text" spellcheck="false" autocomplete="off"></label>
        <label class="on-row"><span>Mission description</span><input id="ms-description" type="text" spellcheck="false" autocomplete="off"></label>
        <fieldset>
          <legend>Transported heroes</legend>
          <!-- A hero travels to the NEXT mission unless a custom destination
               says otherwise, and arrives at the receiving map's EntryPoint. -->
          <label class="on-row"><span>Heroes, moved to next missions</span><input id="ms-hcount" type="number" min="0" max="4" value="0"></label>
          <div id="ms-heroes" class="ms-heroes"></div>
          <div id="ms-entry" class="ms-note"></div>
        </fieldset>
        <fieldset>
          <legend>Start bonuses</legend>
          <div id="ms-bonuses" class="ms-bonuses"></div>
        </fieldset>
      </div>
      <div class="de-foot">
        <button id="ms-cancel" class="ghost">Cancel</button>
        <button id="ms-ok">OK</button>
      </div>
    </div>
  </dialog>
