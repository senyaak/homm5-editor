  <!-- fills: the original editor's Fills tab. Paint an area with the brush,
       pick a preset, and the tool scatters a wood over it — one undo step,
       however many trees that turns out to be. The presets are files
       (assets/fill-presets.xml and the game's Editor/FillPresets.xml); see
       docs/FILL_TOOL.md for what the numbers under each one mean. -->
  <div id="fillpal" style="display:none">
    <div class="pal-head">
      <span class="pal-title">Fills</span>
      <button id="fill-draw" title="drag on the map to paint the area — hold Shift to rub it out">draw: off</button>
      <button id="fill-close" title="close">✕</button>
    </div>
    <div class="fill-sizes" title="how much one drag covers">
      <span>Brush</span>
      <button data-size="1" class="on">x1</button>
      <button data-size="3">x3</button>
      <button data-size="5">x5</button>
      <button data-size="7">x7</button>
      <button data-size="rect">Rect</button>
    </div>
    <select id="fill-list" size="10"></select>
    <div class="fill-presetbtns">
      <button id="fill-new" title="make a preset of your own">New…</button>
      <button id="fill-copy" title="start from the chosen one — the shipped presets are files we do not own">Copy…</button>
      <button id="fill-edit" title="edit this preset (only your own)">Edit…</button>
      <button id="fill-del" class="danger" title="delete this preset (only your own)">✕</button>
    </div>
    <div id="fill-detail"></div>
    <!-- How thick to lay the chosen preset on. 1 is the preset exactly as its
         author wrote it; right of that the lattice closes up and each piece
         claims less room, which is what closes the gaps. -->
    <label id="fill-densitywrap" title="how thick to lay it on — 1.0 is the preset as written, right of that fills the gaps">
      density <input id="fill-density" type="range" min="0.25" max="4" step="0.25" value="1">
      <span id="fill-densityval">1.00x</span>
    </label>
    <div class="pal-foot">
      <div class="fill-actions">
        <div id="fill-count">nothing painted</div>
        <button id="fill-clear" title="drop the painted area without planting anything">Clear</button>
        <button id="fill-apply" class="go" title="plant the chosen preset over the painted area">Fill</button>
      </div>
      <div id="fill-preview"></div>
      <div id="fill-where"></div>
    </div>
  </div>
