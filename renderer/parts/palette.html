  <!-- terrain palette: the content browser's first tab — ground tiles to paint with -->
  <div id="palette" style="display:none">
    <div class="pal-head">
      <span class="pal-title">Terrain</span>
      <button id="brushbtn" title="left-drag edits the terrain; middle/right still move the camera">off</button>
      <button id="pal-close" title="close">✕</button>
    </div>
    <div class="bp-body">
      <label class="bp-row"><span class="k">tool</span>
        <select id="brushmode" title="what the brush does">
          <option value="paint">Paint tile</option>
          <option value="bulk">Bulk (smooth up)</option>
          <option value="dig">Dig (smooth down)</option>
          <option value="raise">Raise (plateau)</option>
          <option value="lower">Lower (pit)</option>
          <option value="ramp">Ramp (walkable step)</option>
          <option value="level">Plateau (level to here)</option>
          <option value="kind">Ground kind (tier)</option>
          <option value="river">River plane</option>
          <option value="mask">Mask (block)</option>
          <option value="erase">Erase (unblock)</option>
        </select>
      </label>
      <label class="bp-row"><span class="k">size</span>
        <select id="brushsizesel" title="brush width in tiles">
          <option value="1">1×1</option>
          <option value="3">3×3</option>
          <option value="5">5×5</option>
          <option value="7">7×7</option>
          <option value="vertex">Vertex (one corner)</option>
          <option value="rect">Rect (drag it out)</option>
        </select>
      </label>
      <!-- Bulk/Dig only: how much one stroke moves the ground, and how far that
           movement carries to the vertices around it. Without these the height
           brush had one fixed step and one fixed taper, so most heights a real
           map holds were simply not reachable. -->
      <label class="bp-row" id="bp-force"><span class="k">force</span>
        <input id="brushforce" type="number" min="0.001" max="32" step="0.05" value="0.35"
               title="units of height one stroke adds at the centre">
      </label>
      <label class="bp-row" id="bp-tension" title="1 tapers to the rim, 0 lifts the whole brush evenly">
        <span class="k">pull</span>
        <input id="brushtension" type="range" min="0" max="1" step="0.05" value="1">
        <span class="bp-val" id="brushtensionval">1.00</span>
      </label>
      <!-- Ground kind: the tier a vertex belongs to, and whether it is a ramp.
           Painted on its own because every other tool moves the ground to change
           it, and a surface already at its final height must not be moved. -->
      <label class="bp-row" id="bp-tier"><span class="k">kind</span>
        <select id="kindtier" title="ground kind the Tier brush paints">
          <option value="0">water</option>
          <option value="1">ground</option>
          <option value="2" selected>plateau 2</option>
          <option value="3">plateau 3</option>
          <option value="4">plateau 4</option>
          <option value="5">plateau 5</option>
        </select>
        <span class="bp-check" title="ramp: walkable half-step instead of a wall">
          <input id="kindramp" type="checkbox"> ramp
        </span>
      </label>
      <!-- Paint strength, and whether a stroke replaces the other layers under
           it. Real ground blends several tiles at one vertex, which a replacing
           brush at full strength cannot produce. -->
      <label class="bp-row" id="bp-weight"><span class="k">weight</span>
        <input id="tilestrength" type="number" min="0" max="255" step="5" value="255"
               title="paint weight 0..255 for the selected tile">
        <span class="bp-check" title="write only this layer, leaving the others under it alone">
          <input id="tilesolo" type="checkbox"> blend
        </span>
      </label>
      <!-- The river plane is finer than the tile grid and graded, so it gets its
           own strength; carving the bed is optional because ground that is
           already at its final height must not be dug. -->
      <label class="bp-row" id="bp-river"><span class="k">water</span>
        <input id="riverstrength" type="number" min="0" max="255" step="5" value="255"
               title="river strength 0..255; 0 erases">
      </label>
      <!-- Carving belongs to a water stroke wherever it comes from, so it shows
           for the tile brush too: painting a Water tile is one. -->
      <label class="bp-row" id="bp-carve" title="also sink the bed under painted water">
        <span class="k">bed</span>
        <span class="bp-check"><input id="rivercarve" type="checkbox" checked> carve it down</span>
      </label>
      <div class="bp-note" id="bp-note"></div>
    </div>
    <div class="pal-sect">tiles<select id="pal-cat"></select></div>
    <div id="pal-grid"></div>
    <div class="pal-foot">
      <div id="pal-sel">no tile selected</div>
      <div class="pal-note">green dot = already in this map</div>
    </div>
  </div>
