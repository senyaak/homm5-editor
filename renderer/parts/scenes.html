  <!-- dialog scenes: the campaigns' cutscenes, played in this same viewport.
       A scene is a stage and a list of shots; the list below IS the scene, and
       clicking a shot puts its camera on screen. -->
  <div id="scenes" style="display:none">
    <div class="pal-head">
      <span class="pal-title">Scene</span>
      <button id="sc-play" title="play from the current shot">▶ Play</button>
      <button id="sc-close" title="close the scene and give the camera back">✕</button>
    </div>
    <div class="sc-open">
      <input id="sc-path" type="text" spellcheck="false" value="DialogScenes/C1/M1/D1"
             title="the scene's folder, as the game addresses it">
      <button id="sc-load">Open</button>
    </div>
    <div id="sc-list"></div>
    <div class="pal-foot">
      <div id="sc-info">no scene open</div>
      <div>A shot is one line: click it to see its camera. <b>Play</b> runs them at their own durations.</div>
    </div>
  </div>
