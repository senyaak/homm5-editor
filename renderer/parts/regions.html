  <!-- regions: named rectangles a script addresses (a mission's "the hero
       reached the pass"). Dragged out on the map like the original's own region
       tool; every field of one is editable in the tree, which is where the
       triggers live. -->
  <div id="regions" style="display:none">
    <div class="pal-head">
      <span class="pal-title">Regions</span>
      <button id="rg-draw" title="drag out a rectangle on the map to add a region">draw: off</button>
      <button id="rg-close" title="close">✕</button>
    </div>
    <div id="rg-list"></div>
    <div class="pal-foot">
      <div id="rg-count">no map</div>
      <div>Drag on the map to add one. <b>Tree…</b> opens its triggers and floor.</div>
    </div>
  </div>
